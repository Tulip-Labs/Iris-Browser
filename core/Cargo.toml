[package]
name = "iris-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Iris's Rust core: adblock-rust and the Mozilla add-on (.xpi) installer, behind a flat C interface"

[lib]
name = "iris_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Brave's engine. No default features: "unsync-regex-caching" would make the
# engine single-threaded, and CEF asks from its IO threads.
adblock = { version = "0.10", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # a panic must never unwind into Odin
strip = true

[profile.dev]
panic = "abort"
