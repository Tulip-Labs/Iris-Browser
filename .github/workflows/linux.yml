# Iris for Linux: builds the program (dist/linux, WebKitGTK from the system)
# on every push, then the Flatpak and the Snap from it, starts Iris at a fractional
# scale and from the Flatpak (in a virtual display) to check it opens, and
# builds the Nix flake. The release workflow calls this too and publishes
# the Flatpak bundle and the Snap.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

# a newer push (or the run started by hand after a patch is applied) replaces
# the run still going on the same branch
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Linux ships only as a Flatpak, a Snap and with Nix, which bring their
    # own (newer) libraries, WebKitGTK 6 among them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and GTK development files
        run: |
          # no man-page index after installs (it can hang the runner); apt gets
          # 10 minutes, then one more try
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get "$@" || { sleep 10; timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get "$@"; }; }
          apt_get update -qq
          apt_get install -y -qq gcc pkg-config libgtk-4-dev libepoxy-dev libfreetype-dev libwebkitgtk-6.0-dev curl
      - name: Build the program (tests run first)
        run: ./build-iris.sh linux
      - name: Collect (a tarball keeps the files' modes)
        run: tar -C dist -czf iris-linux.tar.gz linux && ls -l iris-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: iris-linux.tar.gz

  # Fractional scale, as on niri at 1.25: sway (which scales fractionally the
  # same way) on a 1920x1200 screen, Iris filling it, then resized. The
  # pictures are the screen itself (grim), not Iris's own idea of it: the
  # page must fill its place at the window's exact scale after each change.
  fractional:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      options: --shm-size=1g
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install Iris and sway
        run: |
          # the program's libraries and WebKit's, by the names they load
          dnf install -y -q sway grim mesa-dri-drivers python3 python3-pillow dejavu-sans-fonts procps-ng dbus-daemon util-linux wtype tar gzip \
            webkitgtk6.0 gstreamer1-plugins-good glib-networking bubblewrap \
            'libgtk-4.so.1()(64bit)' 'libepoxy.so.0()(64bit)' 'libGLESv2.so.2()(64bit)'
          mkdir -p /opt && tar -xzf pkg/iris-linux.tar.gz -C /opt && mv /opt/linux /opt/iris
          ln -s /opt/iris/iris /usr/local/bin/iris
          ! ldd /opt/iris/iris | grep "not found"
          # a copy without the file capabilities a container cannot grant
          cp /usr/bin/sway /usr/local/bin/sway-plain
      - name: Iris at 1.25, resized
        run: |
          useradd -m tester
          mkdir -p /tmp/page /tmp/fs && chmod 777 /tmp/fs
          cat > /tmp/page/index.html <<'HTML'
          <!doctype html><meta charset=utf-8><body style="margin:0;font:16px sans-serif;background:repeating-linear-gradient(90deg,#fff 0 1px,#eef 1px 2px)">
          <div id=s style="font-size:40px;padding:20px;background:#fff;border:4px solid #e33">?</div>
          <p style="padding:0 20px">The quick brown fox jumps over the lazy dog. 0123456789</p>
          <div style="position:fixed;right:0;bottom:0;width:120px;height:60px;background:#3a3">right-bottom</div>
          <script>const f=()=>{document.getElementById('s').textContent=innerWidth+' x '+innerHeight+' @ '+devicePixelRatio;console.log('IRIS-DPR '+devicePixelRatio)};f();addEventListener('resize',f)</script>
          HTML
          chmod -R a+rX /tmp/page
          cat > /tmp/sway.conf <<'CONF'
          output HEADLESS-1 resolution 1920x1200 scale 1.25
          default_border none
          CONF
          cat > /tmp/run.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          sway-plain -c /tmp/sway.conf > /tmp/sway.txt 2>&1 &
          for i in $(seq 1 50); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 0.2; done
          export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-* | grep -v lock | head -1))
          export SWAYSOCK=$(ls $XDG_RUNTIME_DIR/sway-ipc.* | head -1)
          (cd /tmp/page && python3 -m http.server 8766 --bind 127.0.0.2 >/dev/null 2>&1 &)
          sleep 1
          export LIBGL_ALWAYS_SOFTWARE=1 IRIS_GL_DEBUG=1 IRIS_NO_SANDBOX=1 GDK_BACKEND=wayland IRIS_UI_DUMP=/tmp/fs/ui.ppm
          dbus-run-session -- iris http://127.0.0.2:8766/ > /tmp/fs/log.txt 2>&1 &
          sleep 18
          grim /tmp/fs/1-full.png
          cp /tmp/fs/ui.ppm /tmp/fs/ui-first.ppm
          swaymsg -t get_tree | grep -o '"rect": {[^}]*}' | head -3
          swaymsg '[app_id="io.github.tulip_labs.Iris"] floating enable, resize set 1000 700, move position 40 40'
          sleep 6
          grim /tmp/fs/2-small.png
          swaymsg '[app_id="io.github.tulip_labs.Iris"] floating disable'
          sleep 6
          grim /tmp/fs/3-full-again.png
          # the menu panel (the ⋮ button, top right: 1510,58 in screen units), at full size
          swaymsg 'seat seat0 cursor set 1510 58'
          swaymsg 'seat seat0 cursor press button1'
          swaymsg 'seat seat0 cursor release button1'
          sleep 3
          grim /tmp/fs/4-panel.png
          pgrep -x iris >/dev/null || touch /tmp/fs/exited
          pkill -x iris; sleep 2; pkill -9 -x iris; sleep 1
          SH
          su tester -c "sh /tmp/run.sh"
          grep -v dbus /tmp/fs/log.txt | tail -60
          tail -20 /tmp/sway.txt
          for f in /tmp/fs/*.png; do [ -s "$f" ] && { echo "SHOT-BEGIN $(basename $f)"; base64 -w0 "$f"; echo; echo "SHOT-END"; }; done
          [ ! -e /tmp/fs/exited ] || { echo "Iris exited"; exit 1; }
          grep -a "drawn by\|CONSOLE\|scale" /tmp/fs/log.txt | head -20
          grep -q "CONSOLE LOG IRIS-DPR" /tmp/fs/log.txt || { echo "WebKit did not draw the page"; exit 1; }
          # the interface on the screen must be Gio's frame pixel for pixel (no
          # scaled copy on the way: that blurs letters at 1.25)
          python3 - /tmp/fs/ui-first.ppm /tmp/fs/1-full.png <<'PY'
          import sys
          from PIL import Image
          u = Image.open(sys.argv[1]).convert("RGB"); g = Image.open(sys.argv[2]).convert("RGB")
          w, band = u.size[0], int(1.25 * 90)  # the tabs and the bar
          bad = sum(1 for y in range(band) for x in range(w)
                    if max(abs(a - b) for a, b in zip(u.getpixel((x, y)), g.getpixel((x, y)))) > 8)
          print(f"interface band {w}x{band}: {bad} pixels differ from Gio's frame")
          sys.exit(1 if bad > w * band // 100 else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-fractional
          path: /tmp/fs/*.png
          if-no-files-found: ignore

  # The Flatpak bundle, from dist/linux, built with flatpak-builder (the
  # GNOME runtime and SDK from Flathub), then installed the way a reader
  # would and started on Wayland (Weston, no screen): it must still be
  # running after 25 seconds, in a Wayland window of its own.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: The program in dist/linux
        run: mkdir -p dist && tar -xzf pkg/iris-linux.tar.gz -C dist && ls dist/linux | head
      - name: Flatpak, flatpak-builder and Weston
        run: |
          # no man-page index after installs (it can hang the runner); apt gets
          # 10 minutes, then one more try
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get "$@" || { sleep 10; timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get "$@"; }; }
          apt_get update -qq
          apt_get install -y -qq flatpak flatpak-builder weston dbus-user-session procps
          # bubblewrap needs user namespaces, which Ubuntu limits by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo --default-branch=stable \
            build packaging/flatpak/io.github.tulip_labs.Iris.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo Iris-x86_64.flatpak io.github.tulip_labs.Iris stable
          ls -l Iris-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Iris-x86_64.flatpak
      - name: Install the bundle and start Iris on Wayland
        run: |
          set -x
          flatpak install --user -y --noninteractive ./Iris-x86_64.flatpak
          flatpak info --user io.github.tulip_labs.Iris
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 $XDG_RUNTIME_DIR
          weston --backend=headless --socket=wayland-1 --width=1280 --height=800 > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S $XDG_RUNTIME_DIR/wayland-1 ] && break; sleep 0.2; done
          [ -S $XDG_RUNTIME_DIR/wayland-1 ] || { cat /tmp/weston.txt; exit 1; }
          export WAYLAND_DISPLAY=wayland-1
          dbus-run-session -- flatpak run --user --env=LIBGL_ALWAYS_SOFTWARE=1 --env=IRIS_GL_DEBUG=1 \
            io.github.tulip_labs.Iris about:blank > /tmp/log.txt 2>&1 &
          sleep 25
          alive=0; pgrep -f /app/lib/iris-browser/iris >/dev/null && alive=1
          grep -v dbus /tmp/log.txt | tail -80
          flatpak kill io.github.tulip_labs.Iris 2>/dev/null || true
          [ $alive = 1 ] || { echo "Iris from the Flatpak exited before 25 seconds"; exit 1; }
          grep -q "native Wayland" /tmp/log.txt || { echo "Iris did not open a Wayland window"; exit 1; }
          echo "Iris from the Flatpak ran for 25 seconds on Wayland."

  # The Snap, from dist/linux, then installed (not started: a strict snap
  # needs snapd's desktop session, which CI does not have).
  snap:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: The program and its engine in packaging/snap/dist (snapcraft sees only that folder)
        run: tar -xzf pkg/iris-linux.tar.gz -C packaging/snap && mv packaging/snap/linux packaging/snap/dist
      - uses: snapcore/action-build@v1
        id: snap
        with:
          path: packaging/snap
      - name: Install it
        run: |
          sudo snap install --dangerous ${{ steps.snap.outputs.snap }}
          snap info --verbose iris-browser | head -20
          ls /snap/iris-browser/current/lib/iris-browser | head
          cp ${{ steps.snap.outputs.snap }} Iris-x86_64.snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: Iris-x86_64.snap

  # nix build github:Tulip-Labs/Iris-Browser must keep working
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: go.mod and go.sum are tidy
        run: |
          nix shell nixpkgs#go -c go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run go mod tidy and commit go.mod and go.sum"; exit 1; }
      - name: nix build
        run: |
          nix build -L .#default
          ls -l result/bin result/lib/iris-browser
          ! ldd result/lib/iris-browser/.iris-wrapped | grep "=> not found"
