# Iris for Linux: builds the .tar.gz, .deb and .rpm on every
# push, then installs them on several distributions and starts Iris on
# each (in a virtual display) to check it opens. The release workflow calls
# this too and publishes what it makes.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # the oldest supported Ubuntu, so the program runs on older systems too
    # (it needs glibc 2.35 or newer: Debian 12, Ubuntu 22.04, Fedora 36 and later)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and GTK development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-4-dev libepoxy-dev curl bzip2
      - name: Chromium (CEF), from the cache when it is there
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ hashFiles('packaging/cef/cef.env') }}
      - name: Build the program, the .tar.gz, the .deb and the .rpm (tests run first)
        run: ./build-iris.sh packages
      - name: Collect
        run: |
          mkdir out
          cp dist/Iris-linux-x86_64.tar.gz dist/LiteGo-linux-x86_64.tar.gz dist/*.deb dist/*.rpm out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  # Windows: the program, the setup and the Store package build, and the
  # shared tests pass (the release builds the same way)
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build Iris for Windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./build-iris.sh windows
          ls -l dist

  # Installs each package the way a reader would, then starts Iris in a
  # virtual display: it must still be running after 20 seconds.
  install:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: "debian:12", kind: deb}
          - {distro: "debian:13", kind: deb}
          - {distro: "ubuntu:22.04", kind: deb}
          - {distro: "ubuntu:24.04", kind: deb, shots: true}
          - {distro: "fedora:42", kind: rpm}
          - {distro: "fedora:43", kind: rpm, shots: true, scale: 2}
          - {distro: "opensuse/tumbleweed", kind: zypper}
          - {distro: "archlinux:latest", kind: tar}
    container:
      image: ${{ matrix.distro }}
      options: --shm-size=1g # Chromium keeps its frames in shared memory
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install (and Weston, a Wayland compositor that runs without a screen)
        run: |
          set -e
          case "${{ matrix.kind }}" in
          deb)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./pkg/*.deb weston procps ffmpeg fonts-dejavu-core dbus python3
            ;;
          rpm)
            dnf install -y ./pkg/*.rpm weston procps-ng mesa-dri-drivers which ffmpeg-free dejavu-sans-fonts util-linux dbus-daemon
            ;;
          zypper)
            zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm weston procps Mesa-dri which dbus-1
            ;;
          tar)
            pacman -Syu --noconfirm --needed gtk4 libepoxy libglvnd mesa nss alsa-lib libdrm libxkbcommon at-spi2-core libcups libxcomposite libxdamage libxrandr weston procps-ng which tar gzip ttf-dejavu dbus
            tar -xzf pkg/Iris-linux-x86_64.tar.gz -C /tmp
            useradd -m tester
            su tester -c "/tmp/Iris-linux-x86_64/install.sh"
            ln -s /home/tester/.local/bin/iris /usr/local/bin/iris
            ;;
          esac
      - name: Libraries are all there
        run: |
          exe=$(readlink -f "$(command -v iris)")
          dir=$(dirname "$exe")
          echo "$exe"
          ls -l "$dir"
          ! ldd "$exe" "$dir/libcef.so" "$dir/iris-helper" | grep "not found"
      - name: Test pages (text, and a VP9 video made here where ffmpeg is at hand)
        run: |
          mkdir -p /tmp/page
          command -v ffmpeg >/dev/null && ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 20 -c:v libvpx-vp9 -b:v 600k -deadline realtime /tmp/page/v.webm
          # an H.264 + AAC video, which Iris plays through its relay (where ffmpeg has x264)
          command -v ffmpeg >/dev/null && ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart /tmp/page/h.mp4 || true
          cat > /tmp/page/video.html <<'HTML'
          <!doctype html><body style="margin:0;background:#202020;font:24px sans-serif;color:#fff">
          <h1 style="color:#f5a">Iris on Chromium</h1>
          <p id=s>video: loading</p>
          <p id=ua></p>
          <p id=s2>h264: loading</p>
          <video id=v src="v.webm" autoplay muted loop width=320 height=180></video>
          <video id=h src="h.mp4" autoplay muted loop width=320 height=180></video>
          <p id=s3>player: loading</p>
          <div class="video-js" id=pj><video id=j src="h.mp4?p" autoplay muted loop width=320 height=180></video></div>
          <script>
          const v = document.getElementById('v'), s = document.getElementById('s');
          v.addEventListener('playing', () => s.textContent = 'video: playing, VP9 ' + v.videoWidth + 'x' + v.videoHeight);
          v.addEventListener('error', () => s.textContent = 'video: error ' + (v.error && v.error.code));
          const h = document.getElementById('h'), s2 = document.getElementById('s2');
          h.addEventListener('playing', () => s2.textContent = 'h264: playing ' + h.videoWidth + 'x' + h.videoHeight + (h.currentSrc.includes('127.0.0.1') ? ' (relay)' : ''));
          h.addEventListener('error', () => s2.textContent = 'h264: error ' + (h.error && h.error.code));
          document.getElementById('ua').textContent = navigator.userAgent;
          // a page's own player (video.js, as on LinkedIn) must never see the error the relay mends
          const j = document.getElementById('j'), pj = document.getElementById('pj'), s3 = document.getElementById('s3');
          j.addEventListener('error', () => { pj.classList.add('vjs-error'); s3.textContent = 'player: saw the error'; });
          j.addEventListener('playing', () => { if (!pj.classList.contains('vjs-error')) s3.textContent = 'player: playing' + (j.currentSrc.includes('127.0.0.1') ? ' (relay)' : ''); });
          </script>
          HTML
          chmod -R a+rX /tmp/page
      - name: Iris starts on Wayland and keeps running
        run: |
          id -u tester >/dev/null 2>&1 || useradd -m tester
          cat > /tmp/wl.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) LIBGL_ALWAYS_SOFTWARE=1 IRIS_GL_DEBUG=1 IRIS_NO_SANDBOX=1
          sc="--scale=${{ matrix.scale || 1 }}"
          for b in "--backend=headless --renderer=gl" "--backend=headless-backend.so --use-gl" "--backend=headless" "--backend=headless-backend.so"; do
            weston $b $sc --socket=wl-test --width=1280 --height=800 --debug > /tmp/weston.txt 2>&1 &
            for i in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.2; done
            [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break
          done
          [ -S "$XDG_RUNTIME_DIR/wl-test" ] || { echo "Weston did not start"; cat /tmp/weston.txt; exit 1; }
          export WAYLAND_DISPLAY=wl-test GDK_BACKEND=wayland
          page=about:blank
          if [ -f /tmp/page/video.html ] && command -v python3 >/dev/null; then
            (cd /tmp/page && python3 -m http.server 8765 --bind 127.0.0.2 >/dev/null 2>&1 &)
            sleep 1
            page=http://127.0.0.2:8765/video.html
          elif [ -f /tmp/page/video.html ]; then
            page=file:///tmp/page/video.html
          fi
          mkdir -p /tmp/shots
          export IRIS_RELAY_LOCAL=1 IRIS_CEF_VERBOSE=1 IRIS_SHOT=/tmp/shots/page IRIS_CEF_ARGS="--enable-logging=stderr --v=0"
          run=""; command -v dbus-run-session >/dev/null && run="dbus-run-session --"
          $run iris "$page" > /tmp/log.txt 2>&1 &
          pid=$!
          sleep 20
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null; sleep 1; kill -9 $pid 2>/dev/null
          grep -v "dbus" /tmp/log.txt | tail -200
          for f in /tmp/shots/*.png; do [ -s "$f" ] && { echo "SHOT-BEGIN $(basename $f)"; base64 -w0 "$f"; echo; echo "SHOT-END"; }; done
          [ $alive = 1 ] || { echo "Iris exited on Wayland before 20 seconds"; exit 1; }
          ! grep -q "no GPU drawing\|no OpenGL context\|could not start" /tmp/log.txt || { echo "Iris ran on Wayland but could not draw"; exit 1; }
          echo "Iris ran for 20 seconds on Wayland."
          SH
          su tester -c "sh /tmp/wl.sh"
      - uses: actions/upload-artifact@v4
        if: matrix.shots && always()
        with:
          name: shots-${{ matrix.kind }}
          path: /tmp/shots/*.png
          if-no-files-found: ignore

  # Fractional scale, as on niri at 1.25: sway (which scales fractionally the
  # same way) on a 1920x1200 screen, Iris filling it, then resized. The
  # pictures are the screen itself (grim), not Iris's own idea of it: the
  # page must fill its place at the window's exact scale after each change.
  fractional:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      options: --shm-size=1g
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install Iris and sway
        run: |
          dnf install -y -q ./pkg/iris-browser-*.rpm sway grim mesa-dri-drivers python3 dejavu-sans-fonts procps-ng dbus-daemon util-linux wtype
          # a copy without the file capabilities a container cannot grant
          cp /usr/bin/sway /usr/local/bin/sway-plain
      - name: Iris at 1.25, resized
        run: |
          useradd -m tester
          mkdir -p /tmp/page /tmp/fs && chmod 777 /tmp/fs
          cat > /tmp/page/index.html <<'HTML'
          <!doctype html><meta charset=utf-8><body style="margin:0;font:16px sans-serif;background:repeating-linear-gradient(90deg,#fff 0 1px,#eef 1px 2px)">
          <div id=s style="font-size:40px;padding:20px;background:#fff;border:4px solid #e33">?</div>
          <p style="padding:0 20px">The quick brown fox jumps over the lazy dog. 0123456789</p>
          <div style="position:fixed;right:0;bottom:0;width:120px;height:60px;background:#3a3">right-bottom</div>
          <script>const f=()=>document.getElementById('s').textContent=innerWidth+' x '+innerHeight+' @ '+devicePixelRatio;f();addEventListener('resize',f)</script>
          HTML
          chmod -R a+rX /tmp/page
          cat > /tmp/sway.conf <<'CONF'
          output HEADLESS-1 resolution 1920x1200 scale 1.25
          default_border none
          CONF
          cat > /tmp/run.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          sway-plain -c /tmp/sway.conf > /tmp/sway.txt 2>&1 &
          for i in $(seq 1 50); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 0.2; done
          export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-* | grep -v lock | head -1))
          export SWAYSOCK=$(ls $XDG_RUNTIME_DIR/sway-ipc.* | head -1)
          (cd /tmp/page && python3 -m http.server 8766 --bind 127.0.0.2 >/dev/null 2>&1 &)
          sleep 1
          export LIBGL_ALWAYS_SOFTWARE=1 IRIS_GL_DEBUG=1 IRIS_NO_SANDBOX=1 GDK_BACKEND=wayland
          dbus-run-session -- iris http://127.0.0.2:8766/ > /tmp/fs/log.txt 2>&1 &
          sleep 18
          grim /tmp/fs/1-full.png
          swaymsg -t get_tree | grep -o '"rect": {[^}]*}' | head -3
          swaymsg '[app_id="io.github.tulip_labs.Iris"] floating enable, resize set 1000 700, move position 40 40'
          sleep 6
          grim /tmp/fs/2-small.png
          swaymsg '[app_id="io.github.tulip_labs.Iris"] floating disable'
          sleep 6
          grim /tmp/fs/3-full-again.png
          # the menu panel (Ctrl+,), at full size
          wtype -M ctrl , -m ctrl
          sleep 3
          grim /tmp/fs/4-panel.png
          pgrep -x iris >/dev/null || touch /tmp/fs/exited
          SH
          su tester -c "sh /tmp/run.sh"
          grep -v dbus /tmp/fs/log.txt | tail -60
          tail -20 /tmp/sway.txt
          for f in /tmp/fs/*.png; do [ -s "$f" ] && { echo "SHOT-BEGIN $(basename $f)"; base64 -w0 "$f"; echo; echo "SHOT-END"; }; done
          [ ! -e /tmp/fs/exited ] || { echo "Iris exited"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-fractional
          path: /tmp/fs/*.png
          if-no-files-found: ignore

  # nix build github:Tulip-Labs/Iris-Browser must keep working
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: go.mod and go.sum are tidy
        run: |
          nix shell nixpkgs#go -c go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run go mod tidy and commit go.mod and go.sum"; exit 1; }
      - name: nix build
        run: |
          nix build -L .#default
          ls -l result/bin result/lib/iris-browser
          ! ldd result/lib/iris-browser/.iris-wrapped result/lib/iris-browser/libcef.so | grep "=> not found"
