# Lite Go for Linux: builds the .tar.gz, .deb, .rpm and Flatpak on every
# push, then installs them on several distributions and starts Lite Go on
# each (in a virtual display) to check it opens. The release workflow calls
# this too and publishes what it makes.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # the oldest supported Ubuntu, so the program runs on older systems too
    # (it needs glibc 2.35 or newer: Debian 12, Ubuntu 22.04, Fedora 36 and later)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and GTK development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-3-dev libepoxy-dev curl bzip2
      - name: Chromium (CEF), from the cache when it is there
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ hashFiles('packaging/cef/cef.env') }}
      - name: Build the program, the .tar.gz, the .deb and the .rpm (tests run first)
        run: ./build-litego.sh packages
      - name: Collect
        run: |
          mkdir out
          cp dist/LiteGo-linux-x86_64.tar.gz dist/*.deb dist/*.rpm out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  # The Flatpak waits for the Chromium engine to be packaged for Flatpak's
  # sandbox (zypak); until then it is not built.
  flatpak:
    if: false
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flatpak bundle
        run: |
          # the SDK in the image is used as it is (updating it in a container
          # fails); the Go extension goes into the user installation
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Sdk.Extension.golang//25.08
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build packaging/flatpak/io.github.tulip_labs.LiteGo.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo LiteGo-x86_64.flatpak io.github.tulip_labs.LiteGo
          ls -l LiteGo-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: LiteGo-x86_64.flatpak
      - name: The Flatpak installs and starts
        continue-on-error: true
        run: |
          set -x
          flatpak install --user -y --noninteractive LiteGo-x86_64.flatpak
          # Mesa for Flatpak apps (a desktop has it; this container does not)
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.GL.default//25.08 || true
          (command -v xvfb-run || dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth || true) >/dev/null 2>&1
          export LIBGL_ALWAYS_SOFTWARE=1 LITEGO_GL_DEBUG=1
          code=0
          timeout 25 xvfb-run -a flatpak run io.github.tulip_labs.LiteGo about:blank > log.txt 2>&1 || code=$?
          cat log.txt
          [ $code = 124 ] && ! grep -q "no GPU drawing\|no OpenGL context" log.txt

  # Installs each package the way a reader would, then starts Lite Go in a
  # virtual display: it must still be running after 20 seconds.
  install:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: "debian:12", kind: deb}
          - {distro: "debian:13", kind: deb}
          - {distro: "ubuntu:22.04", kind: deb}
          - {distro: "ubuntu:24.04", kind: deb, shots: true}
          - {distro: "fedora:42", kind: rpm}
          - {distro: "fedora:43", kind: rpm, shots: true}
          - {distro: "opensuse/tumbleweed", kind: zypper}
          - {distro: "archlinux:latest", kind: tar}
    container:
      image: ${{ matrix.distro }}
      options: --shm-size=1g # Chromium keeps its frames in shared memory
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install (and Weston, a Wayland compositor that runs without a screen)
        run: |
          set -e
          case "${{ matrix.kind }}" in
          deb)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./pkg/*.deb weston procps ffmpeg fonts-dejavu-core
            ;;
          rpm)
            dnf install -y ./pkg/*.rpm weston procps-ng mesa-dri-drivers which ffmpeg-free dejavu-sans-fonts
            ;;
          zypper)
            zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm weston procps Mesa-dri which
            ;;
          tar)
            pacman -Syu --noconfirm --needed gtk3 libepoxy libglvnd mesa nss alsa-lib libdrm libxkbcommon at-spi2-core libcups libxcomposite libxdamage libxrandr weston procps-ng which tar gzip ttf-dejavu
            tar -xzf pkg/LiteGo-linux-x86_64.tar.gz -C /tmp
            useradd -m tester
            su tester -c "/tmp/LiteGo-linux-x86_64/install.sh"
            ln -s /home/tester/.local/bin/lite-go /usr/local/bin/lite-go
            ;;
          esac
      - name: Libraries are all there
        run: |
          exe=$(readlink -f "$(command -v lite-go)")
          dir=$(dirname "$exe")
          echo "$exe"
          ls -l "$dir"
          ! ldd "$exe" "$dir/libcef.so" "$dir/lite-go-helper" | grep "not found"
      - name: Test pages (a VP9 video, made here)
        if: matrix.shots
        run: |
          mkdir -p /tmp/page
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 20 -c:v libvpx-vp9 -b:v 600k -deadline realtime /tmp/page/v.webm
          cat > /tmp/page/video.html <<'HTML'
          <!doctype html><body style="margin:0;background:#202020;font:24px sans-serif;color:#fff">
          <p id=s>video: loading</p>
          <video id=v src="v.webm" autoplay muted loop width=640 height=360></video>
          <script>
          const v = document.getElementById('v'), s = document.getElementById('s');
          v.addEventListener('playing', () => s.textContent = 'video: playing, VP9 ' + v.videoWidth + 'x' + v.videoHeight);
          v.addEventListener('error', () => s.textContent = 'video: error ' + (v.error && v.error.code));
          </script>
          HTML
          chmod -R a+rX /tmp/page
      - name: Lite Go starts on Wayland and keeps running
        run: |
          id -u tester >/dev/null 2>&1 || useradd -m tester
          cat > /tmp/wl.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) LIBGL_ALWAYS_SOFTWARE=1 LITEGO_GL_DEBUG=1 LITEGO_NO_SANDBOX=1
          weston --backend=headless --renderer=gl --socket=wl-test --width=1280 --height=800 --debug > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/wl-test" ]; then
            weston --backend=headless --renderer=pixman --socket=wl-test --width=1280 --height=800 --debug > /tmp/weston.txt 2>&1 &
            for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.2; done
          fi
          [ -S "$XDG_RUNTIME_DIR/wl-test" ] || { echo "Weston did not start"; cat /tmp/weston.txt; exit 1; }
          export WAYLAND_DISPLAY=wl-test GDK_BACKEND=wayland
          page=about:blank
          [ -f /tmp/page/video.html ] && page=file:///tmp/page/video.html
          lite-go "$page" > /tmp/log.txt 2>&1 &
          pid=$!
          shot() {
            shooter=$(command -v weston-screenshooter || ls /usr/lib*/weston/weston-screenshooter /usr/libexec/weston-screenshooter 2>/dev/null | head -1)
            [ -n "$shooter" ] && [ -f /tmp/page/video.html ] || return 0
            (cd /tmp/shots && "$shooter" >/dev/null 2>&1 && for f in wayland-screenshot*.png; do [ -f "$f" ] && mv "$f" "$1.png"; done) || true
          }
          mkdir -p /tmp/shots
          sleep 12; shot video-1
          sleep 3; shot video-2
          sleep 5
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null; sleep 1; kill -9 $pid 2>/dev/null
          cat /tmp/log.txt
          [ $alive = 1 ] || { echo "Lite Go exited on Wayland before 20 seconds"; exit 1; }
          ! grep -q "no GPU drawing\|no OpenGL context\|could not start" /tmp/log.txt || { echo "Lite Go ran on Wayland but could not draw"; exit 1; }
          echo "Lite Go ran for 20 seconds on Wayland."
          SH
          su tester -c "sh /tmp/wl.sh"
      - uses: actions/upload-artifact@v4
        if: matrix.shots && always()
        with:
          name: shots-${{ matrix.kind }}
          path: /tmp/shots/*.png
          if-no-files-found: ignore

  # nix build github:Tulip-Labs/Lite-Go-Browser must keep working
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: go.mod and go.sum are tidy
        run: |
          nix shell nixpkgs#go -c go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run go mod tidy and commit go.mod and go.sum"; exit 1; }
      - name: nix build
        run: |
          nix build -L .#default
          ls -l result/bin
          ! ldd result/bin/.lite-go-wrapped | grep "not found"
