# Lite Go for Linux: builds the .tar.gz, .deb, .rpm and Flatpak on every
# push, then installs them on several distributions and starts Lite Go on
# each (in a virtual display) to check it opens. The release workflow calls
# this too and publishes what it makes.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # the oldest supported Ubuntu, so the program runs on older systems too
    # (it needs glibc 2.35 or newer: Debian 12, Ubuntu 22.04, Fedora 36 and later)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and WebKitGTK development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libepoxy-dev
      - name: Build the program, the .tar.gz, the .deb and the .rpm (tests run first)
        run: ./build-litego.sh packages
      - name: Collect
        run: |
          mkdir out
          cp dist/LiteGo-linux-x86_64.tar.gz dist/*.deb dist/*.rpm out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: LiteGo-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.tulip_labs.LiteGo.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: LiteGo-x86_64.flatpak

  # Installs each package the way a reader would, then starts Lite Go in a
  # virtual display: it must still be running after 20 seconds.
  install:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: "debian:12", kind: deb}
          - {distro: "debian:13", kind: deb}
          - {distro: "ubuntu:22.04", kind: deb}
          - {distro: "ubuntu:24.04", kind: deb}
          - {distro: "fedora:42", kind: rpm}
          - {distro: "fedora:43", kind: rpm}
          - {distro: "opensuse/tumbleweed", kind: zypper}
          - {distro: "archlinux:latest", kind: tar}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install
        run: |
          set -e
          case "${{ matrix.kind }}" in
          deb)
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./pkg/*.deb xvfb xauth procps
            ;;
          rpm)
            dnf install -y ./pkg/*.rpm xorg-x11-server-Xvfb xauth procps-ng mesa-dri-drivers which
            ;;
          zypper)
            zypper --non-interactive install --allow-unsigned-rpm ./pkg/*.rpm xvfb-run procps Mesa-dri which
            ;;
          tar)
            pacman -Syu --noconfirm --needed webkit2gtk-4.1 gtk3 libepoxy libglvnd mesa xorg-server-xvfb xorg-xauth procps-ng which tar gzip
            tar -xzf pkg/LiteGo-linux-x86_64.tar.gz -C /tmp
            useradd -m tester
            su tester -c "/tmp/LiteGo-linux-x86_64/install.sh"
            ln -s /home/tester/.local/bin/lite-go /usr/local/bin/lite-go
            ;;
          esac
      - name: Libraries are all there
        run: |
          exe=$(readlink -f "$(command -v lite-go)")
          echo "$exe"
          ! ldd "$exe" | grep "not found"
      - name: Lite Go starts and keeps running
        run: |
          id -u tester >/dev/null 2>&1 || useradd -m tester
          cat > /tmp/smoke.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LITEGO_GL_DEBUG=1
          timeout 20 xvfb-run -a -s "-screen 0 1280x800x24" lite-go about:blank > /tmp/log.txt 2>&1
          code=$?
          cat /tmp/log.txt
          [ $code = 124 ] || { echo "Lite Go exited with $code before 20 seconds"; exit 1; }
          ! grep -q "no GPU drawing\|no OpenGL context" /tmp/log.txt || { echo "Lite Go ran but could not draw"; exit 1; }
          echo "Lite Go ran for 20 seconds and drew its window."
          SH
          chmod 755 /tmp/smoke.sh
          su tester -c "sh /tmp/smoke.sh"
      - name: Lite Go starts on Wayland too (a headless Weston)
        run: |
          case "${{ matrix.kind }}" in
          deb) DEBIAN_FRONTEND=noninteractive apt-get install -y -qq weston >/dev/null ;;
          rpm) dnf install -y -q weston ;;
          zypper) zypper --non-interactive -q install weston ;;
          tar) pacman -S --noconfirm --needed weston >/dev/null ;;
          esac
          cat > /tmp/wl.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) LIBGL_ALWAYS_SOFTWARE=1 LITEGO_GL_DEBUG=1
          weston --backend=headless --renderer=gl --socket=wl-test --width=1280 --height=800 > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/wl-test" ]; then echo "Weston did not start here; skipped:"; tail -5 /tmp/weston.txt; exit 0; fi
          WAYLAND_DISPLAY=wl-test GDK_BACKEND=wayland timeout 20 lite-go about:blank > /tmp/log.txt 2>&1
          code=$?
          cat /tmp/log.txt
          [ $code = 124 ] || { echo "Lite Go exited with $code on Wayland before 20 seconds"; exit 1; }
          ! grep -q "no GPU drawing\|no OpenGL context" /tmp/log.txt || { echo "Lite Go ran on Wayland but could not draw"; exit 1; }
          echo "Lite Go ran for 20 seconds on Wayland."
          SH
          su tester -c "sh /tmp/wl.sh"

  # nix build github:Tulip-Labs/Lite-Go-Browser must keep working
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: go.mod and go.sum are tidy
        run: |
          nix shell nixpkgs#go -c go mod tidy
          git diff --exit-code go.mod go.sum || { echo "run go mod tidy and commit go.mod and go.sum"; exit 1; }
      - name: nix build
        run: |
          nix build -L .#default
          ls -l result/bin
          ! ldd result/bin/.lite-go-wrapped | grep "not found"
