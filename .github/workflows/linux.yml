# Iris (Chromium) for Linux: builds the Odin app (linux/) against CEF and the
# Rust core, checks every hand-written C binding against the real headers,
# runs the tests, draws one frame offscreen, and builds the Flatpak bundle
# (CEF is downloaded, not built). release-cef.yml (tags cef-v*) calls this
# too and publishes the bundle. The bench job compares Iris with Google
# Chrome on Speedometer; releases skip it.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "Called by a release: skip the benchmark"
        type: boolean
        default: false

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CEF build is the one in packaging/cef_version.lock,
  # which .github/workflows/cef-update.yml keeps current; the jobs read it
  # with packaging/check/cef-pin.sh (CEF_TARBALL and the checksums)
  # Odin dev-2026-11a, pinned by checksum
  ODIN_URL: https://github.com/odin-lang/Odin/releases/download/dev-2026-11a/odin-linux-amd64-dev-2026-11a.tar.gz
  ODIN_SHA256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618

jobs:
  # The Odin app built and linked against the CEF distribution, every C
  # binding checked against the real headers (CEF's own among them), and
  # the binary started once (it loads libcef, registers the C API version
  # and answers --version).
  odin-cef:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --shm-size=1g --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Wayland, EGL, the tools, and what libcef.so links to
        run: |
          pacman -Syu --noconfirm --needed libsoup3 harfbuzz fontconfig wayland wayland-protocols libxkbcommon mesa libdrm \
            nss alsa-lib at-spi2-core libcups libxcomposite libxdamage libxrandr libxfixes pango cairo dbus expat \
            pkgconf clang gcc python diffutils git rust > /dev/null
      - name: Odin
        run: |
          curl -sSfL "$ODIN_URL" -o /tmp/odin.tar.gz
          echo "$ODIN_SHA256  /tmp/odin.tar.gz" | sha256sum -c -
          mkdir -p /opt/odin && tar -xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1
          echo /opt/odin >> $GITHUB_PATH
          echo ODIN_ROOT=/opt/odin >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: core-${{ hashFiles('core/Cargo.lock') }}
      - name: "The Rust core (adblock-rust, the add-on installer): header, tests"
        run: |
          sh core/check-header.sh
          cd core && cargo test --locked && cargo build --release --locked
      - name: The CEF build to use (packaging/cef_version.lock)
        run: sh packaging/check/cef-pin.sh
      - uses: actions/cache@v4
        with:
          path: /opt/cef.tar.bz2
          key: cef-${{ env.CEF_TARBALL }}
      - name: CEF
        run: |
          [ -f /opt/cef.tar.bz2 ] || curl -sSfL "https://cef-builds.spotifycdn.com/$CEF_TARBALL.tar.bz2" -o /opt/cef.tar.bz2
          sha256sum /opt/cef.tar.bz2
          sh packaging/check/cef-pin.sh --verify /opt/cef.tar.bz2
          tar -xjf /opt/cef.tar.bz2 -C /opt --no-same-owner
          # CEF reads its ICU data and resources from libcef.so's folder
          cp /opt/$CEF_TARBALL/Resources/icudtl.dat /opt/$CEF_TARBALL/Resources/*.pak /opt/$CEF_TARBALL/Release/
          cp -r /opt/$CEF_TARBALL/Resources/locales /opt/$CEF_TARBALL/Release/
          echo CEF_DIR=/opt/$CEF_TARBALL >> $GITHUB_ENV
      - name: The Chromium build's own version (version_cef.odin, release-notes-cef.md)
        run: sh packaging/check/versions-cef.sh
      - name: The YouTube script is the same on Android and Linux
        run: cmp linux/src/youtube.js android/app/src/main/assets/js/youtube.js
      - name: Every C binding against the real headers (CEF's among them)
        run: sh linux/build.sh check
      - name: No format string turns a page script into a syntax error
        run: python3 linux/tools/check-fmt-braces.py
      - name: The CEF bindings are what tools/bind_cef.sh makes
        run: |
          # the checkout may have no .git here, so compare against copies
          cp linux/src/cef_capi.odin /tmp/cef_capi.odin
          cp linux/src/cef_gen.odin /tmp/cef_gen.odin
          sh linux/tools/bind_cef.sh
          diff -u /tmp/cef_capi.odin linux/src/cef_capi.odin
          diff -u /tmp/cef_gen.odin linux/src/cef_gen.odin
      - name: "Tests (CEF engine: adblock-rust through the FFI, the add-on installer, DRM staging)"
        run: CORE_PREBUILT=1 CEF_RPATH=$CEF_DIR/Release sh linux/build.sh test
      - name: Build (optimised, CEF engine)
        run: CORE_PREBUILT=1 CEF_RPATH=$CEF_DIR/Release sh linux/build.sh release
      - name: It starts (libcef loads, the API version is accepted)
        run: |
          IRIS_CEF_DIR=$CEF_DIR/Release linux/iris --version
          ldd linux/iris | grep libcef
      - name: The chrome offscreen (every shader compiles, the glass and text draw, clicks and keys work)
        run: |
          export IRIS_CEF_DIR=$CEF_DIR/Release
          LIBGL_ALWAYS_SOFTWARE=1 linux/iris --render-check /tmp/iris-render.ppm

  # The CEF build as its own Flatpak (io.github.tulip_labs.Iris.Cef): CEF is
  # downloaded, not built, so this takes minutes, not hours.
  flatpak-cef:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak, flatpak-builder and Weston
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@" || { sleep 30; timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }; }
          apt_get update
          apt_get install -y --no-install-recommends -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold flatpak flatpak-builder elfutils librsvg2-common desktop-file-utils optipng weston dbus-user-session procps
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: The CEF tarball's checksum into the manifest (while it is a placeholder)
        run: |
          sh packaging/check/cef-pin.sh
          m=packaging/flatpak/io.github.tulip_labs.Iris.Cef.yml
          if grep -q 'sha256: 0\{64\}' $m; then
            curl -sSfL "https://cef-builds.spotifycdn.com/$CEF_TARBALL.tar.bz2" -o /tmp/cef.tar.bz2
            sh packaging/check/cef-pin.sh --verify /tmp/cef.tar.bz2
            sum=$(sha256sum /tmp/cef.tar.bz2 | cut -d' ' -f1)
            echo "::warning::CEF tarball sha256 is $sum: pin it in $m"
            sed -i "s/sha256: 0\{64\}/sha256: $sum/" $m
          fi
      - name: Build the bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo --default-branch=stable \
            build packaging/flatpak/io.github.tulip_labs.Iris.Cef.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo Iris-Cef-x86_64.flatpak io.github.tulip_labs.Iris.Cef stable
          mkdir -p art && cp Iris-Cef-x86_64.flatpak art/ && ls -l art
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cef
          path: art/Iris-Cef-x86_64.flatpak
      - name: Install the bundle and start Iris (CEF) on Wayland
        run: |
          flatpak install --user -y --noninteractive ./Iris-Cef-x86_64.flatpak
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 $XDG_RUNTIME_DIR
          weston --backend=headless --socket=wayland-1 --width=1280 --height=800 > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S $XDG_RUNTIME_DIR/wayland-1 ] && break; sleep 0.2; done
          export WAYLAND_DISPLAY=wayland-1
          dbus-run-session -- flatpak run --user --env=LIBGL_ALWAYS_SOFTWARE=1 io.github.tulip_labs.Iris.Cef https://example.org > /tmp/log.txt 2>&1 &
          sleep 40
          alive=0; pgrep -f /app/libexec/iris >/dev/null && alive=1
          grep -v dbus /tmp/log.txt | tail -60
          flatpak kill io.github.tulip_labs.Iris.Cef 2>/dev/null || true
          [ $alive = 1 ] || { echo "Iris (CEF) from the Flatpak exited before 40 seconds"; exit 1; }
          echo "Iris (CEF) from the Flatpak ran for 40 seconds on Wayland."

  # Speedometer 3.1 in Iris (CEF, the Flatpak above) and in Google Chrome
  # stable, one after the other on the same runner. Runners have no GPU, so
  # both draw with software GL: the ratio is Iris's overhead next to Chrome,
  # not a real-world score. Informational for now: it never fails the run.
  bench:
    needs: flatpak-cef
    # not for a release, and not for a run started by hand (the updater's)
    if: ${{ github.event_name != 'workflow_dispatch' && !inputs.release }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # WebKit/Speedometer has no tags: the head of its release/3.1 branch
      SPEEDOMETER_REF: 1386415be8fef2f6b6bbdbe1828872471c5d802a
      # 10 is Speedometer's default; fewer keeps the job short in software GL
      BENCH_ITERATIONS: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-cef
          path: art
      - name: Flatpak, Weston and the GNOME 50 runtime
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@" || { sleep 30; timeout 600 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }; }
          apt_get update
          apt_get install -y --no-install-recommends -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold flatpak weston dbus-user-session procps
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive ./art/Iris-Cef-x86_64.flatpak
          google-chrome --version
      - name: Speedometer, served on localhost
        run: |
          mkdir -p /tmp/speedometer && cd /tmp/speedometer
          git init -q && git fetch -q --depth 1 https://github.com/WebKit/Speedometer "$SPEEDOMETER_REF" && git checkout -q FETCH_HEAD
          python3 -m http.server 8000 --bind 127.0.0.1 --directory /tmp/speedometer > /tmp/http.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8000/index.html >/dev/null && break; sleep 0.2; done
          echo "BENCH_URL=http://127.0.0.1:8000/index.html?iterationCount=$BENCH_ITERATIONS&startAutomatically=true" >> $GITHUB_ENV
      - name: Google Chrome (headless, DevTools protocol)
        timeout-minutes: 45
        run: |
          python3 -I packaging/check/speedometer-chrome.py "$BENCH_URL" google-chrome | tee /tmp/chrome.txt
          score=$(sed -n 's/^SPEEDOMETER \([0-9.]*\)$/\1/p' /tmp/chrome.txt | tail -1)
          [ -n "$score" ] || { echo "no score from Chrome"; exit 1; }
          echo "CHROME_SCORE=$score" >> $GITHUB_ENV
      # IRIS_CEF_BENCH_URL: Iris loads the page, waits for Speedometer to
      # finish, prints SPEEDOMETER <score> and exits
      - name: Iris (CEF) under headless Weston
        timeout-minutes: 60
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 $XDG_RUNTIME_DIR
          weston --backend=headless --socket=wayland-1 --width=1600 --height=1000 > /tmp/weston.txt 2>&1 &
          for i in $(seq 1 50); do [ -S $XDG_RUNTIME_DIR/wayland-1 ] && break; sleep 0.2; done
          [ -S $XDG_RUNTIME_DIR/wayland-1 ] || { cat /tmp/weston.txt; exit 1; }
          export WAYLAND_DISPLAY=wayland-1
          rc=0
          timeout 3300 dbus-run-session -- flatpak run --user --env=LIBGL_ALWAYS_SOFTWARE=1 --env=IRIS_CEF_BENCH_URL="$BENCH_URL" --env=IRIS_CEF_BENCH_TIMEOUT=900 \
            io.github.tulip_labs.Iris.Cef > /tmp/iris-bench.txt 2>&1 || rc=$?
          flatpak kill io.github.tulip_labs.Iris.Cef 2>/dev/null || true
          # (anywhere on a line: CEF's own logging may share the output)
          # Iris prints "IRIS_CEF_BENCH score=<n> seconds=<s> gpu_frames=<f>"
          score=$(tr -d '\r' < /tmp/iris-bench.txt | sed -n -e 's/.*IRIS_CEF_BENCH score=\([0-9][0-9.]*\).*/\1/p' -e 's/.*SPEEDOMETER \([0-9][0-9.]*\).*/\1/p' | tail -1)
          if [ -z "$score" ]; then
            echo "no score from Iris (exit $rc)"; grep IRIS_CEF_BENCH /tmp/iris-bench.txt; grep -v -e dbus -e IRIS_CEF_BENCH /tmp/iris-bench.txt | tail -60; exit 1
          fi
          echo "SPEEDOMETER $score"
          echo "IRIS_SCORE=$score" >> $GITHUB_ENV
      - name: The scores, in the job summary
        if: always()
        run: |
          ratio=""
          if [ -n "${IRIS_SCORE:-}" ] && [ -n "${CHROME_SCORE:-}" ]; then
            ratio=$(awk -v a="$IRIS_SCORE" -v b="$CHROME_SCORE" 'BEGIN { if (b > 0) printf "%.2f", a / b }')
          fi
          {
            echo "### Speedometer 3.1 ($BENCH_ITERATIONS iterations, software GL, no GPU)"
            echo
            echo "| Browser | Score |"
            echo "| --- | --- |"
            echo "| Iris (Chromium, CEF) | ${IRIS_SCORE:-no score} |"
            echo "| Google Chrome stable, headless | ${CHROME_SCORE:-no score} |"
            echo
            echo "Iris / Chrome: **${ratio:-n/a}** (1.00 means no overhead; runners have no GPU, so this is Iris's overhead next to Chrome, not a real-world score)"
          } >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bench
          path: |
            /tmp/iris-bench.txt
            /tmp/chrome.txt
            /tmp/weston.txt
          if-no-files-found: ignore
