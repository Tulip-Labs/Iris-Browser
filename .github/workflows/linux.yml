# Builds Lite Go for Linux (WebKitGTK) on every push, so the Linux build is
# checked as often as the Windows one. Download the result from the run's
# artifacts; tagged releases attach it too (see release.yml).
name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and WebKitGTK development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libepoxy-dev
      - name: Build (the script runs the tests first)
        run: ./build-litego.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: LiteGo-linux-x86_64
          path: dist/LiteGo-linux-x86_64.tar.gz
