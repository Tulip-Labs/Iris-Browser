# Iris for Linux: builds the Swift app (linux/) and runs its tests, starts it
# at a fractional scale under a headless Wayland compositor to check it opens
# and draws, and builds the Flatpak bundle. The release workflow calls this
# too and publishes the bundle.
name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3-noble
      options: --shm-size=1g --privileged
    steps:
      - uses: actions/checkout@v4
      - name: GTK, libadwaita and WebKitGTK development files
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pkg-config libadwaita-1-dev libgtksourceview-5-dev \
            libwebkitgtk-6.0-dev libsoup-3.0-dev libwayland-dev sway grim xwayland dbus-x11 fonts-cantarell > /dev/null
      - name: Build
        working-directory: linux
        run: swift build -c release
      - name: Tests
        working-directory: linux
        run: swift test
      # Iris at 1.25, as on niri: it must open, lay out and draw its glass.
      # (Only this test turns WebKit's process sandbox off, because a CI
      # container cannot make the namespaces it needs; Iris itself never
      # does.)
      - name: Start Iris at a fractional scale
        working-directory: linux
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          chmod 700 $XDG_RUNTIME_DIR
          printf 'output HEADLESS-1 resolution 1600x1000 scale 1.25\ndefault_border none\n' > /tmp/sway.conf
          sway -c /tmp/sway.conf > /tmp/sway.log 2>&1 &
          for i in $(seq 1 50); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 0.2; done
          export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-* | grep -v lock | head -1))
          export HOME=$(mktemp -d) GDK_BACKEND=wayland LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          .build/release/Iris > /tmp/iris.log 2>&1 &
          sleep 60
          grim /tmp/iris-1.25.png
          pgrep -x Iris > /dev/null || { echo "Iris did not stay open"; cat /tmp/iris.log; exit 1; }
          cat /tmp/iris.log
          # the window drew: the screen is not one flat colour
          python3 - <<'PY'
          import zlib, struct
          d = open('/tmp/iris-1.25.png', 'rb').read()
          assert len(set(d[1000:200000])) > 64, "the screen is empty"
          print("drawn")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screen
          path: /tmp/iris-1.25.png

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Iris-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.tulip_labs.Iris.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: The bundle, for the release
        run: mkdir -p art && cp Iris-x86_64.flatpak art/ && ls -l art
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: art/Iris-x86_64.flatpak
