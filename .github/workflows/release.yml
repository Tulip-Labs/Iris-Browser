# Builds Iris for Linux (the Flatpak bundle) and Android (the APK) and
# publishes them as a GitHub release with one SHA256SUMS file. Runs when a
# tag like v2.0.0 is pushed, or by hand from the Actions tab (give the tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  # the release page, with its notes, before any file
  create:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Iris ${TAG#v}" --notes-file packaging/release-notes.md
          fi

  linux:
    uses: ./.github/workflows/linux.yml

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # publishes what was built: Linux always (the release waits for it);
  # Android when its build passed, otherwise the notes say it follows
  publish:
    needs: [create, linux, android]
    if: always() && needs.create.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: The files (the Flatpak bundle, and the APKs when they were built; Iris for Android finds its updates here)
        run: |
          ls -l art
          files="art/Iris-x86_64.flatpak"
          if [ -f art/Iris-android.apk ]; then
            files="$files art/Iris-android.apk"
          fi
          if [ -f art/Iris-android-cefrium.apk ]; then
            files="$files art/Iris-android-cefrium.apk"
          fi
          if [ ! -f art/Iris-android.apk ]; then
            gh release view "$TAG" --json body --jq .body > notes.md
            printf '\n\n**Android:** the APKs of this version follow in the next release.\n' >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" $files --clobber
      - name: Checksums of every file
        run: |
          mkdir all && cd all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
