# Builds Iris for Linux (the Flatpak bundle) and Android (the APK) and
# publishes them as a GitHub release with one SHA256SUMS file. Runs when a
# tag like v2.0.0 is pushed, or by hand from the Actions tab (give the tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  # the release page, with its notes, before any file
  create:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Iris ${TAG#v}" --notes-file packaging/release-notes.md
          fi

  linux:
    uses: ./.github/workflows/linux.yml

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [create, linux, android]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: The files (the Flatpak bundle and the APK; Iris for Android finds its updates here)
        run: |
          ls -l art
          gh release upload "$TAG" art/Iris-x86_64.flatpak art/Iris-android.apk --clobber
      - name: Checksums of every file
        run: |
          mkdir all && cd all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
