# Builds Iris for Linux (the Flatpak bundle and the Snap) and Android, and
# publishes them as a GitHub release with one SHA256SUMS file. The container
# image goes out from container.yml, Nix builds from the repository itself.
# Runs when a tag like v1.0.0 is pushed, or by hand from the Actions tab
# (give the tag to publish).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  # the release page, with its notes, before any file
  create:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Iris ${TAG#v}" --notes-file packaging/release-notes.md
          fi

  linux:
    uses: ./.github/workflows/linux.yml

  android:
    needs: create
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25" # Cefrium (the page engine) needs JDK 25
      - name: Build Iris for Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk Iris-android.apk
          sha256sum Iris-android.apk
          gh release upload "$TAG" Iris-android.apk --clobber

  # the Linux files, the container launcher and the checksums of every file
  publish:
    needs: [create, linux, android]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Linux files to the release (the Flatpak bundle, the Snap, the container launcher)
        run: |
          ls -l art
          gh release upload "$TAG" art/*.flatpak art/*.snap packaging/container/iris-container --clobber
      - name: Checksums of every file
        run: |
          mkdir all && cd all
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
