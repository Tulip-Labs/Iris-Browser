# Builds Iris's container image (packaging/container/Containerfile) and
# publishes it to GitHub's registry (ghcr.io), and to Docker Hub and Quay.io
# when their secrets are set (DOCKERHUB_USERNAME and DOCKERHUB_TOKEN,
# QUAY_USERNAME and QUAY_TOKEN). Podman and Docker pull from all three.
name: Container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["packaging/container/**", ".github/workflows/container.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          ver=$(sed -n 's/^const version = "\(.*\)"/\1/p' cmd/iris/main.go)
          names="ghcr.io/$owner/iris-browser"
          [ -n "$DOCKERHUB_USERNAME" ] && names="$names docker.io/$DOCKERHUB_USERNAME/iris-browser"
          [ -n "$QUAY_USERNAME" ] && names="$names quay.io/$QUAY_USERNAME/iris-browser"
          tags=""
          for n in $names; do tags="$tags,$n:$ver,$n:latest"; done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"
          echo "local=ghcr.io/$owner/iris-browser:$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Containerfile
          load: true
          tags: ${{ steps.names.outputs.tags }}
      - name: Every library is there
        run: |
          img=${{ steps.names.outputs.local }}
          docker run --rm --entrypoint sh "$img" -c \
            '! ldd /opt/iris/iris /opt/iris/electron/electron | grep "not found"'
          docker run --rm --entrypoint sh "$img" -c 'ls /opt/iris/electron/resources/app/main.js'
      - name: Sign in to the registries
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          [ -z "$DOCKERHUB_USERNAME" ] || echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          [ -z "$QUAY_USERNAME" ] || echo "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          for t in $(echo "${{ steps.names.outputs.tags }}" | tr , ' '); do docker push "$t"; done
