# Iris with Servo for light pages (docs/engines.md): builds Servo's bridge
# (webview/servo/rust), builds Iris with it, and starts it at a 1.25 scale
# with one page Servo must draw and one the router gives to Chromium.
name: Servo

on:
  push:
    branches: ["engine/**"]
  workflow_dispatch:

jobs:
  servo-lib:
    uses: ./.github/workflows/servo-lib.yml

  app:
    needs: servo-lib
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build tools and GTK development files
        run: |
          # the man pages' index is rebuilt after every install and can hang the
          # runner for half an hour: not needed here. apt gets 10 minutes, then
          # one more try.
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo apt-get "$@" || { sleep 10; timeout 600 sudo apt-get "$@"; }; }
          apt_get update -qq
          apt_get install -y -qq gcc pkg-config libgtk-4-dev libepoxy-dev libfreetype-dev curl bzip2
      - uses: actions/download-artifact@v4
        with:
          name: libirisservo
          path: webview/servo/lib
      - name: Chromium (CEF), from the cache when it is there
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ hashFiles('packaging/cef/cef.env') }}
      - name: Tests (routing, the shared cookie store)
        run: go test ./core/route/ ./core/session/... ./webview/route/
      - name: Build Iris with Servo
        run: |
          ./build-iris.sh linux # with Servo: its bridge is in webview/servo/lib
          ldd dist/linux/iris | grep -i servo
          du -sh dist/linux dist/linux/libirisservo.so
          tar -C dist -czf iris-servo.tar.gz linux
      - uses: actions/upload-artifact@v4
        with:
          name: iris-servo
          path: iris-servo.tar.gz

  pages:
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-servo
      - name: Install what Iris needs, and sway
        run: |
          # the man pages' index is rebuilt after every install and can hang the
          # runner for half an hour: not needed here. apt gets 10 minutes, then
          # one more try.
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { timeout 600 sudo apt-get "$@" || { sleep 10; timeout 600 sudo apt-get "$@"; }; }
          apt_get update -qq
          apt_get install -y -qq sway grim python3 dbus fonts-dejavu-core libgtk-4-1 libepoxy0 libnss3 libnspr4 \
            libasound2t64 libgbm1 libdrm2 libxkbcommon0 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libxcomposite1 \
            libxdamage1 libxrandr2 libgl1-mesa-dri libegl1 libgles2 libfontconfig1 libharfbuzz0b python3-pil
          tar -xzf iris-servo.tar.gz
          ls -l linux | head -40
      - name: A light page in Servo and a heavy one in Chromium, at 1.25
        run: |
          mkdir -p /tmp/page /tmp/fs
          cat > /tmp/page/article.html <<'HTML'
          <!doctype html><meta charset=utf-8><title>An article</title>
          <body style="margin:0;font:18px serif;background:#fff">
          <div style="height:240px;background:#22aa77"></div>
          <h1 style="margin:20px">Red pandas</h1>
          <p style="margin:20px">The red panda is a small mammal native to the eastern Himalayas and southwestern China. 0123456789</p>
          <script>document.title = 'An article (script ran)'</script>
          HTML
          cat > /tmp/page/heavy.html <<'HTML'
          <!doctype html><meta charset=utf-8><title>Heavy</title>
          <body style="margin:0;background:#aa2266"><h1 style="color:#fff">Drawn by Chromium</h1>
          HTML
          cat > /tmp/sway.conf <<'CONF'
          output HEADLESS-1 resolution 1920x1200 scale 1.25
          default_border none
          CONF
          cat > /tmp/run.sh <<'SH'
          export XDG_RUNTIME_DIR=$(mktemp -d) WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          sway -c /tmp/sway.conf > /tmp/sway.txt 2>&1 &
          for i in $(seq 1 50); do ls $XDG_RUNTIME_DIR/wayland-* >/dev/null 2>&1 && break; sleep 0.2; done
          export WAYLAND_DISPLAY=$(basename $(ls $XDG_RUNTIME_DIR/wayland-* | grep -v lock | head -1))
          (cd /tmp/page && python3 -m http.server 8766 --bind 127.0.0.2 >/dev/null 2>&1 &)
          (cd /tmp/page && python3 -m http.server 8767 --bind 127.0.0.3 >/dev/null 2>&1 &)
          sleep 1
          export RUST_LOG=warn LIBGL_ALWAYS_SOFTWARE=1 IRIS_GL_DEBUG=1 IRIS_NO_SANDBOX=1 GDK_BACKEND=wayland IRIS_HEAVY_HOSTS=127.0.0.3
          dbus-run-session -- $PWD/linux/iris http://127.0.0.2:8766/article.html > /tmp/fs/log.txt 2>&1 &
          sleep 25
          grim /tmp/fs/1-servo.png
          # a second start hands the address to the running Iris: a new tab
          $PWD/linux/iris http://127.0.0.3:8767/heavy.html >> /tmp/fs/log2.txt 2>&1
          sleep 20
          grim /tmp/fs/2-heavy.png
          pgrep -x iris >/dev/null || touch /tmp/fs/exited
          pkill -x iris; sleep 2; pkill -9 -x iris; pkill -9 -f iris-helper
          true # nothing left to stop is fine
          SH
          sh /tmp/run.sh || true
          echo "== log"; grep -v "dbus" /tmp/fs/log.txt | tail -80
          for f in /tmp/fs/*.png; do [ -s "$f" ] && { echo "SHOT-BEGIN $(basename $f)"; base64 -w0 "$f"; echo; echo "SHOT-END"; }; done
          [ ! -e /tmp/fs/exited ] || { echo "Iris exited"; exit 1; }
          echo "== Servo"; grep -a "Iris: Servo\|WARN\|ERROR" /tmp/fs/log.txt | head -60
          echo "== engines"; grep -a "drawn by" /tmp/fs/log.txt
          echo "== memory"; grep -a "Iris: memory" /tmp/fs/log.txt | tail -5
          grep -aq "drawn by Servo (127.0.0.2" /tmp/fs/log.txt || { echo "the article did not go to Servo"; exit 1; }
          grep -aq "drawn by Chromium (127.0.0.3" /tmp/fs/log.txt || { echo "the heavy page did not go to Chromium"; exit 1; }
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/fs/1-servo.png').convert('RGB')
          w, h = im.size
          # the article's green band, under the bar: drawn by Servo
          hits = sum(1 for x in range(200, w - 200, 50) for y in range(140, 300, 20) if all(abs(a - b) < 24 for a, b in zip(im.getpixel((x, y)), (0x22, 0xaa, 0x77))))
          print('green pixels sampled:', hits)
          if hits < 20:
              raise SystemExit('Servo drew nothing where the article is')
          # the band spans the page: laid out at the window's width, not the size it opened with
          right = sum(1 for x in range(w - 400, w - 100, 50) for y in range(140, 300, 20) if all(abs(a - b) < 24 for a, b in zip(im.getpixel((x, y)), (0x22, 0xaa, 0x77))))
          print('green pixels on the right:', right)
          if right < 10:
              raise SystemExit("Servo laid the page out narrower than the window")
          im2 = Image.open('/tmp/fs/2-heavy.png').convert('RGB')
          hits2 = sum(1 for x in range(200, w - 200, 50) for y in range(200, 1000, 50) if all(abs(a - b) < 24 for a, b in zip(im2.getpixel((x, y)), (0xaa, 0x22, 0x66))))
          print('heavy page pixels sampled:', hits2)
          if hits2 < 20:
              raise SystemExit('Chromium drew nothing where the heavy page is')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-servo
          path: /tmp/fs/*
          if-no-files-found: ignore
