# Builds Iris for Android (Kotlin, Jetpack Compose, and two page engines in
# android/: System WebView and Cefrium) and keeps both APKs as artifacts of
# the run. Runs by hand from the Actions tab, and on pushes that touch the app.
#
# Signing: updates install over Iris only when every APK carries the same
# key. Put the release keystore in the repository's secrets once
# (IRIS_KEYSTORE as base64, IRIS_KEYSTORE_PASSWORD, IRIS_KEY_ALIAS); without
# them the APKs are signed with the runner's throwaway debug key.
name: Android

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Cefrium 0.21.0 ships Java 25 bytecode: the build runs on JDK 25
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: The release key
        env:
          IRIS_KEYSTORE: ${{ secrets.IRIS_KEYSTORE }}
        run: |
          if [ -n "$IRIS_KEYSTORE" ]; then
            echo "$IRIS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/iris.jks"
            echo "IRIS_KEYSTORE_FILE=$RUNNER_TEMP/iris.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No IRIS_KEYSTORE secret: this APK cannot update an Iris signed with the release key"
          fi
      # The two flavors build in separate Gradle runs, on purpose: the
      # Cefrium plugin refuses any build whose pages carry no libcef.so,
      # and the webview flavor has none by design. A run that builds only
      # the webview flavor leaves the plugin out entirely (see the
      # webviewOnly gate in app/build.gradle.kts); a run that builds only
      # the cefrium flavor never runs the webview flavor's native-lib
      # merge, so the plugin's check only ever sees the flavor that
      # carries the engine. One run building both flavors trips the check
      # on the webview flavor and fails the whole build.
      - name: Build webview APK
        working-directory: android
        env:
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleWebviewRelease
      - name: Build cefrium APK
        working-directory: android
        env:
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleCefriumRelease
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/webview/release/app-webview-release.apk out/Iris-android.apk
          cp android/app/build/outputs/apk/cefrium/release/app-cefrium-release.apk out/Iris-android-cefrium.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-android
          path: out/
