# Builds Iris for Android (the Kotlin app in android/) and keeps the APK as
# an artifact of the run. Runs by hand from the Actions tab, and on pushes
# that touch the app.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25" # Cefrium (the page engine) needs JDK 25
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/Iris-android.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Iris-android
          path: out/Iris-android.apk
