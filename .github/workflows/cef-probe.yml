name: CEF probe (temporary)
on:
  push:
    paths: [".github/workflows/cef-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          n='cef_binary_156.0.32+g3d1f4ab+chromium-156.0.8078.109_linux64_minimal.tar.bz2'
          e=$(echo "$n" | sed 's/+/%2B/g')
          echo "PROBE plus: $(curl -s -o /dev/null -w '%{http_code}' -I "https://cef-builds.spotifycdn.com/$n")"
          echo "PROBE enc:  $(curl -s -o /dev/null -w '%{http_code}' -I "https://cef-builds.spotifycdn.com/$e")"
          n2='cef_binary_158.0.6+g23f1736+chromium-158.0.8127.89_linux64_minimal.tar.bz2'
          echo "PROBE new plus: $(curl -s -o /dev/null -w '%{http_code}' -I "https://cef-builds.spotifycdn.com/$n2")"
          echo "PROBE new enc:  $(curl -s -o /dev/null -w '%{http_code}' -I "https://cef-builds.spotifycdn.com/$(echo "$n2"|sed 's/+/%2B/g')")"
