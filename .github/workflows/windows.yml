# Builds Iris for Windows (Electron draws every page) and starts it on a real
# Windows runner: the program must open, Electron must start beside it and
# draw a test page (its console line reaches the log), and a screenshot of the
# window is kept with the run.
name: Windows

on:
  push:
    branches: [main, "release/**", "integrate/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (the script runs the tests first)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./build-iris.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: iris-windows-portable
          path: dist/Iris-portable.zip
          retention-days: 7

  start:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-windows-portable
      - name: Start Iris on a test page
        shell: pwsh
        run: |
          Expand-Archive Iris-portable.zip -DestinationPath .
          New-Item -ItemType Directory -Force page, out | Out-Null
          @'
          <!doctype html><meta charset=utf-8><body style="margin:0;font:16px sans-serif">
          <div id=s style="font-size:40px;padding:20px;border:4px solid #e33">?</div>
          <p style="padding:0 20px">The quick brown fox jumps over the lazy dog. 0123456789</p>
          <script>const f=()=>{document.getElementById('s').textContent=innerWidth+' x '+innerHeight+' @ '+devicePixelRatio;console.log('IRIS-DPR '+devicePixelRatio)};f();addEventListener('resize',f)</script>
          '@ | Set-Content page\index.html
          Start-Process python -ArgumentList '-m','http.server','8766','--bind','127.0.0.1','--directory','page' -WindowStyle Hidden
          # the test page's server must answer before Iris opens it (a fixed
          # wait was too short on a cold runner: ERR_CONNECTION_REFUSED)
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:8766/ -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $up) { Write-Error "The test page's server did not start"; exit 1 }
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $p = Start-Process Iris\Iris.exe -ArgumentList 'http://127.0.0.1:8766/' -PassThru `
            -RedirectStandardOutput out\stdout.txt -RedirectStandardError out\log.txt
          Start-Sleep 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\out\iris.png")
          Get-Process | Where-Object { $_.Name -in 'Iris', 'electron' } | Format-Table Name, Id, WorkingSet64 | Out-String | Tee-Object out\processes.txt
          $iris = -not $p.HasExited
          $electron = @(Get-Process electron -ErrorAction SilentlyContinue).Count -gt 0
          Stop-Process -Name electron -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          Start-Sleep 2
          Get-Content out\log.txt -ErrorAction SilentlyContinue | Select-Object -Last 60
          if (-not $iris) { Write-Error "Iris exited ($($p.ExitCode))"; exit 1 }
          if (-not $electron) { Write-Error "Electron did not start"; exit 1 }
          if (-not (Select-String -Path out\log.txt -Pattern 'IRIS-DPR' -Quiet)) { Write-Error "Electron did not draw the page"; exit 1 }
          Write-Host "Iris and Electron run; the page was drawn."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-windows-start
          path: out
