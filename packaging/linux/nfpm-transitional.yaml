# lite-go-browser, the name Iris was packaged under until 1.0.19: an empty
# package that brings in iris-browser, so apt upgrade moves an existing
# install over (dnf and zypper follow iris-browser's Obsoletes instead).
# It can be removed once iris-browser is installed.
name: lite-go-browser
version: ${VERSION}
arch: ${ARCH}
platform: linux
section: oldlibs
priority: optional
maintainer: Tulip Labs <tulip-labs@users.noreply.github.com>
homepage: https://github.com/Tulip-Labs/Iris-Browser
license: GPL-3.0-only
description: |-
  Transitional package: Lite Go is now Iris.
  This package brings in iris-browser and can be removed.
depends:
  - iris-browser (= ${VERSION})
