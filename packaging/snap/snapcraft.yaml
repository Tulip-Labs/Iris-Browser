# Iris as a Snap, for Ubuntu and the other systems with Snap.
#
# It packages dist/linux (./build-iris.sh linux); snapcraft sees only this
# folder, so CI copies dist/linux here as dist/ first (see linux.yml, job
# snap):
#   ./build-iris.sh linux && cp -a dist/linux packaging/snap/dist
#   cd packaging/snap && snapcraft pack
name: iris-browser
title: Iris
summary: A light, fast browser with shields built in
description: |
  Iris is a small browser written in Go. Iris Shields blocks ads, trackers,
  cookie notices and fingerprinting; containers keep separate sign-ins; tabs
  in the background sleep and give their memory back.
license: GPL-3.0-only
website: https://github.com/Tulip-Labs/Iris-Browser
icon: dist/io.github.tulip_labs.Iris.png
adopt-info: iris
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  iris:
    command: lib/iris-browser/iris
    common-id: io.github.tulip_labs.Iris
    desktop: share/applications/io.github.tulip_labs.Iris.desktop
    extensions: [gnome] # GTK 4 from the GNOME content snap
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - browser-support
      - home
      - removable-media

parts:
  iris:
    plugin: dump
    source: dist
    override-build: |
      # the program's folder (organize would only move it after this step)
      mkdir -p "$CRAFT_PART_INSTALL/lib/iris-browser"
      cp -a "$CRAFT_PART_SRC"/. "$CRAFT_PART_INSTALL/lib/iris-browser/"
      cd "$CRAFT_PART_INSTALL"
      rm -f lib/iris-browser/chrome-sandbox # setuid files are not allowed in snaps
      install -Dm644 lib/iris-browser/io.github.tulip_labs.Iris.metainfo.xml share/metainfo/io.github.tulip_labs.Iris.metainfo.xml
      install -Dm644 lib/iris-browser/io.github.tulip_labs.Iris.png share/icons/hicolor/256x256/apps/io.github.tulip_labs.Iris.png
      # the desktop entry starts the snap's command
      sed -e 's|^Exec=iris|Exec=iris-browser|' -e 's|^Icon=.*|Icon=${SNAP}/share/icons/hicolor/256x256/apps/io.github.tulip_labs.Iris.png|' \
        lib/iris-browser/io.github.tulip_labs.Iris.desktop > io.desktop
      install -Dm644 io.desktop share/applications/io.github.tulip_labs.Iris.desktop
      rm io.desktop
      craftctl set version="$(cat lib/iris-browser/VERSION)"
    # Chromium's libraries the GNOME content snap does not carry
    stage-packages:
      - libnss3
      - libnspr4
      - libasound2t64
      - libcups2t64
      - libgbm1
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxrandr2
      - libxshmfence1
