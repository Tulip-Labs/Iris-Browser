# Lite Go as a Flatpak, on the GNOME runtime (which has WebKitGTK).
#   flatpak-builder --user --install --force-clean build packaging/flatpak/io.github.tulip_labs.LiteGo.yml
# The build fetches Go modules, so it shares the network while building.
app-id: io.github.tulip_labs.LiteGo
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: lite-go
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  # updates from the GitHub releases: the new bundle is installed by the host's flatpak
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/golang/bin
  build-args:
    - --share=network
  env:
    GOFLAGS: -mod=mod
    GOTOOLCHAIN: auto
    CGO_ENABLED: '1'
modules:
  - name: lite-go
    buildsystem: simple
    build-commands:
      - go build -tags "webkit novulkan" -trimpath -ldflags "-s -w" -o lite-go ./cmd/litego
      - go run tools/sum.go lite-go
      - install -Dm755 lite-go /app/bin/lite-go
      - install -Dm644 lite-go.sha256 /app/bin/lite-go.sha256
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - sed -e "s/^Icon=.*/Icon=${FLATPAK_ID}/" -e "s/^StartupWMClass=.*/StartupWMClass=${FLATPAK_ID}/" packaging/linux/lite-go.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - dist
          - android
          - .git
