# Iris as a Flatpak: the way to install Iris on Linux.
#
# Builds the Swift app in linux/ with the GNOME 50 SDK (GTK 4, libadwaita,
# WebKitGTK 6) and Flathub's Swift 6 SDK extension. The Swift runtime is
# linked into the program, so the app needs nothing beyond the GNOME runtime.
#
# This is the manifest CI uses for the bundle each release carries; its
# build may fetch swift-adwaita and its packages from GitHub. A Flathub
# submission would list every source instead (see README.md here).
app-id: io.github.tulip_labs.Iris
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: iris
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # the GPU, and cameras for calls (WebRTC); screen sharing goes through
  # the desktop's portal and PipeWire
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.FileManager1 # "show in folder" for downloads

# H.264, H.265 and AAC for WebKit's video (GStreamer's libav plugin takes
# ffmpeg from here)
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: "25.08"
    add-ld-path: .
    autodelete: false

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

build-options:
  append-path: /usr/lib/sdk/swift6/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/lib

modules:
  - name: iris
    buildsystem: simple
    build-options:
      build-args:
        - --share=network # SwiftPM fetches swift-adwaita
    sources:
      - type: dir
        path: ../../linux
        dest: linux
      - type: dir
        path: ../linux
        dest: desktop
      - type: script
        dest-filename: iris.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec /app/lib/iris/iris "$@"
    build-commands:
      - cd linux && swift build -c release --static-swift-stdlib
      - install -Dm755 linux/.build/release/Iris /app/lib/iris/iris
      - cp -r linux/.build/release/Iris_Iris.resources /app/lib/iris/
      - install -Dm755 iris.sh /app/bin/iris
      - install -Dm644 linux/Sources/Iris/Resources/icons/hicolor/scalable/apps/io.github.tulip_labs.Iris.svg /app/share/icons/hicolor/scalable/apps/io.github.tulip_labs.Iris.svg
      - install -Dm644 linux/Sources/Iris/Resources/icons/hicolor/256x256/apps/io.github.tulip_labs.Iris.png /app/share/icons/hicolor/256x256/apps/io.github.tulip_labs.Iris.png
      - install -Dm644 desktop/io.github.tulip_labs.Iris.desktop /app/share/applications/io.github.tulip_labs.Iris.desktop
      - install -Dm644 desktop/io.github.tulip_labs.Iris.metainfo.xml /app/share/metainfo/io.github.tulip_labs.Iris.metainfo.xml
