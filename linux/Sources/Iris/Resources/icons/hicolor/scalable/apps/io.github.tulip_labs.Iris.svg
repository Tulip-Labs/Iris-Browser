<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Iris, goddess of the rainbow and messenger of the gods: her profile in
       liquid glass before her rainbow, a wing of glass behind her. An
       original drawing made for the Iris browser. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24145e"/>
      <stop offset="0.55" stop-color="#4a2db4"/>
      <stop offset="1" stop-color="#0f86c6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ff8fd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b"/>
      <stop offset="0.18" stop-color="#ff9f0a"/>
      <stop offset="0.36" stop-color="#ffe14d"/>
      <stop offset="0.54" stop-color="#34d399"/>
      <stop offset="0.7" stop-color="#38bdf8"/>
      <stop offset="0.86" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d08cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="lensblur"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="glassFill" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feOffset dx="-12" dy="16" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.9"/>
      <feComposite in2="edge" operator="in"/>
    </filter>
    <filter id="innerDark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feOffset dx="14" dy="-14" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
      <feFlood flood-color="#1b0f4a" flood-opacity="0.35"/>
      <feComposite in2="edge" operator="in"/>
    </filter>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="12" dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
    </filter>
    <path id="squircle" d="M512 40c330 0 472 142 472 472s-142 472-472 472S40 842 40 512 182 40 512 40z"/>
    <clipPath id="sq"><use href="#squircle"/></clipPath>

    <!-- her profile, facing right: brow and nose in one line, as in the old
         Greek marbles; full lips, a firm small chin, a long neck; the hair
         swept back into a knot -->
    <path id="head" d="
      M 548 214
      C 612 210 664 246 680 300
      C 688 328 686 352 690 374
      C 696 404 712 432 728 462
      C 736 476 734 486 720 490
      C 712 492 704 494 700 500
      C 702 508 704 512 712 518
      C 718 524 714 532 706 534
      C 712 540 714 548 708 554
      C 700 560 696 566 698 576
      C 702 594 696 612 680 620
      C 664 628 644 628 628 624
      C 626 660 630 694 640 726
      C 650 760 668 792 694 820
      L 696 862
      L 446 862
      C 470 820 482 778 480 736
      C 478 708 470 688 456 672
      C 414 680 372 668 346 640
      C 318 646 284 632 270 604
      C 254 572 266 532 300 520
      C 286 494 286 462 302 440
      C 284 396 300 340 344 300
      C 400 248 470 218 548 214 Z"/>
    <!-- a wing of glass behind her: Iris flies the messages of the gods -->
    <path id="wing" d="
      M 470 640
      C 420 560 330 470 214 430
      C 160 412 120 420 104 444
      C 150 452 186 470 210 492
      C 160 488 124 500 110 524
      C 160 524 200 538 228 560
      C 184 566 156 584 148 610
      C 200 600 246 606 282 624
      C 248 640 230 662 230 688
      C 280 664 330 660 372 672
      C 410 682 446 680 470 640 Z"/>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g id="bowg">
      <path d="M -150 1300 A 690 690 0 0 1 1230 1300" fill="none" stroke="url(#bow)" stroke-width="200" filter="url(#soft)" opacity="0.85"/>
      <path d="M -150 1300 A 690 690 0 0 1 1230 1300" fill="none" stroke="url(#bow)" stroke-width="120"/>
    </g>

    <!-- the wing -->
    <use href="#wing" filter="url(#shade)"/>
    <clipPath id="wingClip"><use href="#wing"/></clipPath>
    <g clip-path="url(#wingClip)">
      <g filter="url(#lensblur)" transform="translate(330 470) scale(1.15) translate(-320 -480)">
        <rect width="1024" height="1024" fill="url(#sky)"/>
        <path d="M -150 1300 A 690 690 0 0 1 1230 1300" fill="none" stroke="url(#bow)" stroke-width="120"/>
      </g>
      <use href="#wing" fill="url(#glassFill)"/>
      <use href="#wing" filter="url(#inner)"/>
    </g>
    <use href="#wing" fill="none" stroke="url(#rim)" stroke-width="5"/>

    <!-- her shadow -->
    <use href="#head" filter="url(#shade)"/>
    <!-- through her: the sky and the rainbow, bent by the glass -->
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <g clip-path="url(#headClip)">
      <g filter="url(#lensblur)" transform="translate(520 520) scale(1.12) translate(-520 -540)">
        <rect width="1024" height="1024" fill="url(#sky)"/>
        <rect width="1024" height="1024" fill="url(#glow)"/>
        <path d="M -150 1300 A 690 690 0 0 1 1230 1300" fill="none" stroke="url(#bow)" stroke-width="120"/>
      </g>
      <use href="#head" fill="url(#glassFill)"/>
      <use href="#head" filter="url(#innerDark)"/>
      <use href="#head" filter="url(#inner)"/>
      <!-- the hair: waves swept back into the knot, a ribbon of rainbow -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <path d="M 640 262 C 580 250 520 262 470 300 C 430 330 400 370 380 420" stroke-opacity="0.55" stroke-width="7"/>
        <path d="M 664 300 C 600 290 540 304 492 340 C 452 372 428 410 414 452" stroke-opacity="0.4" stroke-width="6"/>
        <path d="M 672 338 C 616 334 566 350 524 384 C 492 410 470 442 456 482" stroke-opacity="0.3" stroke-width="5"/>
        <path d="M 352 560 C 312 556 292 520 310 490 C 330 458 380 462 394 496 C 406 526 386 550 358 546 C 336 542 330 516 346 504 C 360 494 376 504 372 518" stroke-opacity="0.6" stroke-width="6"/>
      </g>
      <!-- brow, eye and lips, cut into the glass -->
      <path d="M 628 368 C 648 356 670 356 686 366" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round"/>
      <path d="M 640 394 C 654 386 670 386 682 394 C 672 402 652 404 640 394 Z" fill="#ffffff" fill-opacity="0.8"/>
      <path d="M 640 398 C 650 410 668 410 680 400" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
      <path d="M 690 535 C 696 538 702 538 708 535" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- her rim of light -->
    <use href="#head" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <!-- glints where the light falls: crown, brow, nose, chin -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M 520 232 C 580 226 630 244 660 280" stroke-width="12" opacity="0.95"/>
      <path d="M 696 400 C 704 424 714 444 724 460" stroke-width="7" opacity="0.85"/>
      <path d="M 690 592 C 692 602 688 610 682 614" stroke-width="5" opacity="0.7"/>
      <path d="M 150 436 C 220 440 300 480 380 560" stroke-width="6" opacity="0.75"/>
    </g>
    <use href="#squircle" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"/>
  </g>
</svg>
