<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Iris</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- GitHub Pages serves this page for a missing address at any depth, so it
       carries its own styles and points home with a full address. -->
  <link rel="icon" type="image/png" href="https://tulip-labs.github.io/Iris-Browser/assets/iris-64.png">
  <style>
    :root {
      --bg-1: #F5F6F8; --bg-2: #ECEEF2; --text: #16171A; --text-2: #50555E;
      --glass: rgba(255,255,255,.6); --rim: rgba(255,255,255,.95); --edge: rgba(0,0,0,.06);
      --btn-bg: #16171A; --btn-fg: #fff; --focus: #0A84FF;
      --spectrum: #FF3B30 0deg, #FF9500 45deg, #FFD60A 90deg, #34C759 140deg, #32D2F5 190deg, #0A84FF 235deg, #FFF4E2 300deg, #FF3B30 360deg;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #0B0C0E; --bg-2: #15171B; --text: #F2F3F5; --text-2: #AEB3BC;
        --glass: rgba(255,255,255,.06); --rim: rgba(255,255,255,.26); --edge: rgba(255,255,255,.07);
        --btn-bg: #F2F3F5; --btn-fg: #0B0C0E; --focus: #4DA3FF;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
      color: var(--text); background: linear-gradient(180deg, var(--bg-1), var(--bg-2)) fixed;
      -webkit-font-smoothing: antialiased; text-align: center;
    }
    main { max-width: 480px; }
    .ring { width: 160px; aspect-ratio: 1; margin: 0 auto 40px; position: relative; border-radius: 50%; }
    .ring::before, .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    .ring::before {
      background: conic-gradient(from 20deg, var(--spectrum)); filter: blur(6px); opacity: .55;
      -webkit-mask: radial-gradient(closest-side, transparent 60%, #000 72%, #000 86%, transparent 97%);
      mask: radial-gradient(closest-side, transparent 60%, #000 72%, #000 86%, transparent 97%);
    }
    .ring::after {
      background: radial-gradient(closest-side, transparent 55%, rgba(255,255,255,.6) 59%, rgba(255,255,255,.05) 72%, rgba(255,255,255,.5) 96%, transparent 98%);
      box-shadow: 0 16px 40px rgba(0,0,0,.08);
    }
    h1 { font-size: 40px; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 16px; }
    p { margin: 0 0 32px; font-size: 18px; line-height: 1.5; color: var(--text-2); }
    a {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px;
      background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 24px rgba(0,0,0,.16);
    }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>Nothing here.</h1>
    <p>The light passed straight through: this page doesn't exist, or has moved.</p>
    <a href="https://tulip-labs.github.io/Iris-Browser/">Back to Iris</a>
  </main>
</body>
</html>
